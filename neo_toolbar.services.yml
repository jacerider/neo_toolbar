parameters:
  # Every hook this module implements is a method on a class under `src/Hook`,
  # so there is nothing procedural left for core's hook collector to find. This
  # is the parameter core provides for exactly that statement, set by a dozen
  # core modules. It is not cosmetic: without it the collector reads
  # `neo_toolbar_toolbar_view_access()` — a global function that is not a hook
  # at all — as an implementation of a `hook_toolbar_view_access` that does not
  # exist, and registers it as one. Extension loading is unaffected, so the
  # `.module` file is still included and that forwarder is still defined.
  neo_toolbar.skip_procedural_hook_scan: true

services:
  plugin.manager.neo_toolbar_item:
    class: Drupal\neo_toolbar\ToolbarItemPluginManager
    parent: default_plugin_manager

  plugin.manager.neo_toolbar_region:
    class: Drupal\neo_toolbar\ToolbarRegionPluginManager
    arguments: ['@module_handler', '@cache.discovery']

  neo_toolbar.access_gate:
    class: Drupal\neo_toolbar\ToolbarAccessGate
    # `masquerade` is neither required nor installed by this module — it is the
    # provider of one toolbar item plugin and nothing more — so the reference is
    # the optional one core uses for exactly this shape, and the constructor
    # parameter it feeds is a plain nullable object.
    arguments: ['@current_user', '@module_handler', '@?masquerade']

  neo_toolbar.repository:
    class: Drupal\neo_toolbar\ToolbarRepository
    arguments: ['@entity_type.manager', '@current_route_match']

  neo_toolbar.lazy_builders:
    class: Drupal\neo_toolbar\LazyBuilders
    arguments: [ '@entity_type.manager', '@plugin.manager.neo_toolbar_region']

  plugin.manager.neo_toolbar_badge:
    class: Drupal\neo_toolbar\ToolbarBadgePluginManager
    parent: default_plugin_manager

  Drupal\neo_toolbar\Hook\NeoToolbarHooks:
    # The hook collector registers a hook class as an autowired service under
    # its own class name when the container has no definition for it. This one
    # is written out instead, because both collaborators are named services
    # rather than autowirable types.
    class: Drupal\neo_toolbar\Hook\NeoToolbarHooks
    arguments: ['@neo_toolbar.repository', '@neo_toolbar.access_gate']
